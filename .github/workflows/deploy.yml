# Деплой на хостинг AdriaHost по FTPS при пуше в main.
# Заливаются только изменённые файлы: состояние хранится на сервере
# в .ftp-deploy-sync-state.json (не удалять, иначе следующий деплой зальёт всё заново).
#
# Секреты (Settings → Secrets and variables → Actions):
#   FTP_SERVER    budo420.adriahost.com
#   FTP_USERNAME  FTP-аккаунт для деплоя
#   FTP_PASSWORD  его пароль
#   DEPLOY_TOKEN  токен deploy-hook.php (тот же, что 'deploy' => ['token' => …] в app-config.php);
#                 без него шаг миграций пропускается — тогда миграции через админку (Migrations) или phpMyAdmin

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Минификация CSS и JS прямо в рабочей копии раннера: в репозитории исходники
      # остаются читаемыми, на хостинг уходят сжатые. Комментарии и пробелы убираются,
      # синтаксис не понижается. Версия esbuild зафиксирована, чтобы вывод не менялся сам
      - name: Minify CSS and JS
        run: npx -y esbuild@0.25.10 source/css/*.css source/js/*.js --minify --outdir=source --outbase=source --allow-overwrite --log-level=warning

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Путь от корня FTP-аккаунта (/home/placemar/domains)
          server-dir: place4market.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            .claude/**
            README.md
            temp/**

      # Новые миграции — сразу после заливки (source/inc/migrations.php). Ошибка миграции
      # роняет workflow, в журнале — запись critical с уведомлением
      - name: Apply migrations
        if: env.DEPLOY_TOKEN != ''
        run: |
          curl -sS --fail-with-body --max-time 120 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" https://place4market.com/deploy-hook.php

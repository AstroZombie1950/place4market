# Деплой на хостинг AdriaHost по FTPS при пуше в main.
# Заливаются только изменённые файлы: состояние хранится на сервере
# в .ftp-deploy-sync-state.json (не удалять, иначе следующий деплой зальёт всё заново).
#
# Секреты (Settings → Secrets and variables → Actions):
#   FTP_SERVER    budo420.adriahost.com
#   FTP_USERNAME  FTP-аккаунт для деплоя
#   FTP_PASSWORD  его пароль

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Путь от корня FTP-аккаунта (/home/placemar/domains)
          server-dir: place4market.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            .claude/**
            README.md
            temp/**

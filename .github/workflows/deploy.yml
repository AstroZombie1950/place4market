# Деплой на сервер place4market (85.17.188.76, DirectAdmin + OpenLiteSpeed) по SSH при пуше в main.
#
# rsync сравнивает файлы по содержимому (-c) и заливает только изменённые; даты у
# неизменённых файлов не трогает, поэтому ?v= в asset() меняется только у изменённых.
# Файлы, удалённые из репозитория, удаляются и на сервере (--delete). Папки, которых нет
# в репозитории (uploads/, .well-known/), исключены и поэтому не удаляются.
#
# Ключ деплоя на сервере ограничен (forced command /usr/local/bin/p4m-deploy-gate в
# ~placemar/.ssh/authorized_keys): можно только rsync в public_html (через rrsync, выйти
# из папки нельзя) и `migrate` — php source/db/migrate.php.
# Изменённый .htaccess подхватывается сам: служба p4m-htaccess.path перезапускает веб-сервер.
#
# Секрет (Settings → Secrets and variables → Actions):
#   SSH_DEPLOY_KEY  закрытый ключ ed25519 «github-actions-deploy place4market»

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 85.17.188.76
  DEPLOY_USER: placemar
  # Ключи сервера (ssh-keyscan 85.17.188.76; ED25519 SHA256:yUAlazntaGvEW7mkM6uiH6tE6+XBbjci/nyxHB2D0QQ)
  KNOWN_HOSTS: |
    85.17.188.76 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPVu57naAlvezNsVzE2vuFakPRkbLdvQyZqAoASBtaWW
    85.17.188.76 ssh-rsa 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Минификация CSS и JS прямо в рабочей копии раннера: в репозитории исходники
      # остаются читаемыми, на сервер уходят сжатые. Комментарии и пробелы убираются,
      # синтаксис не понижается. Версия esbuild зафиксирована, чтобы вывод не менялся сам
      - name: Minify CSS and JS
        run: npx -y esbuild@0.25.10 source/css/*.css source/js/*.js --minify --outdir=source --outbase=source --allow-overwrite --log-level=warning

      - name: SSH key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host deploy\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      # Заливка: в списке — только изменённые файлы (itemize). Путь «.» — public_html (rrsync)
      - name: Upload
        run: |
          rsync -rlcp --chmod=D755,F644 --delete --itemize-changes \
            --exclude='.git*' --exclude='.github/' --exclude='.vscode/' --exclude='.claude/' \
            --exclude='README.md' --exclude='temp/' --exclude='doc/' \
            --exclude='uploads/' --exclude='.well-known/' --exclude='.ftp-deploy-sync-state.json' \
            ./ deploy:.

      # Новые миграции — сразу после заливки (source/inc/migrations.php). Ошибка миграции
      # роняет workflow, в журнале — запись critical с уведомлением
      - name: Apply migrations
        run: ssh deploy migrate
